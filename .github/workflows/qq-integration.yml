name: QQ integration
on:
  push:
    paths: ['integrations/qq_bot/**', '.github/workflows/qq-integration.yml']
  pull_request:
    paths: ['integrations/qq_bot/**', '.github/workflows/qq-integration.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qq_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1' 'PyYAML>=6,<7' 'python-dotenv>=1,<2'
      - run: python scripts/manage.py check
