name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m pytest -q -o faulthandler_timeout=60
        timeout-minutes: 8
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-browser-test-results
          path: frontend/test-results/
      - run: python scripts/package.py --skip-build
      - name: Verify versioned deployment archive
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from scripts.verify_release import verify
          verify(f"releases/acm-lab-{version('oj-account-crawler')}.zip")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acm-lab-deployment
          path: releases/*
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runtime, server-codex, server-browser, server-browser-codex]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ${{ matrix.target }} -t acm-lab:ci .
      - run: docker run --rm --entrypoint acm-web acm-lab:ci --help
      - name: Verify read-only multi-user container
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:size=268435456,mode=1777
          --tmpfs /app/data:uid=10001,gid=10001,mode=0700
          -e ACM_ACCESS_TOKEN=ci-only-setup-token-not-production
          acm-lab:ci python scripts/container_smoke.py
      - if: contains(matrix.target, 'codex')
        run: docker run --rm --entrypoint codex acm-lab:ci --version
      - name: Verify optional browser runtime with sandbox
        if: contains(matrix.target, 'browser')
        run: >-
          docker run --rm --read-only --init
          --security-opt no-new-privileges:true
          --security-opt seccomp=deploy/chromium-seccomp.json
          --cap-drop ALL --shm-size=256m
          --tmpfs /tmp:size=268435456,mode=1777
          --entrypoint python acm-lab:ci scripts/browser_runtime_smoke.py
