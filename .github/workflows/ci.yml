name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/package.py --skip-build
      - run: python scripts/verify_release.py releases/acm-lab-0.3.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: acm-lab-deployment
          path: releases/*
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runtime, server-codex]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ${{ matrix.target }} -t acm-lab:ci .
      - run: docker run --rm --entrypoint acm-web acm-lab:ci --help
      - if: matrix.target == 'server-codex'
        run: docker run --rm --entrypoint codex acm-lab:ci --version
