services:
  web:
    build:
      context: .
      target: "${ACM_IMAGE_TARGET:-runtime}"
    image: acm-lab:0.21.4
    restart: unless-stopped
    init: true
    user: "${ACM_UID:-1000}:${ACM_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ACM_ENV: production
      ACM_MULTI_USER: "${ACM_MULTI_USER:-true}"
      ACM_ALLOWED_HOSTS: "${ACM_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      ACM_AI_ALLOWED_HOSTS: "${ACM_AI_ALLOWED_HOSTS:-api.openai.com,api.deepseek.com,api.anthropic.com,generativelanguage.googleapis.com,dashscope.aliyuncs.com,dashscope-intl.aliyuncs.com,api.moonshot.cn,api.siliconflow.cn,open.bigmodel.cn}"
      ACM_PUBLIC_ORIGIN: "${ACM_PUBLIC_ORIGIN:-}"
      # 宿主代理连接容器时，填写实际 Docker 网关/代理 IP，不能一律照抄回环地址。
      FORWARDED_ALLOW_IPS: "${ACM_TRUSTED_PROXIES:-127.0.0.1}"
      ACM_ENABLE_CODEX: "false"
      ACM_ENABLE_SERVER_CODEX: "${ACM_ENABLE_SERVER_CODEX:-false}"
      ACM_ACCESS_TOKEN: "${ACM_ACCESS_TOKEN:?请先运行 python3 scripts/bootstrap.py}"
      ACM_DATA_DIR: "/app/data/${ACM_DATA_SUBDIR:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ACM_GOOGLE_TRANSLATE_KEY: "${ACM_GOOGLE_TRANSLATE_KEY:-}"
      ACM_BING_TRANSLATE_KEY: "${ACM_BING_TRANSLATE_KEY:-}"
      ACM_BING_TRANSLATE_REGION: "${ACM_BING_TRANSLATE_REGION:-}"
      ACM_SELFTEST_URL: "${ACM_SELFTEST_URL:-}"
      ACM_SELFTEST_KEY: "${ACM_SELFTEST_KEY:-}"
    volumes:
      - ./data:/app/data
      - ./account.toml:/app/account.toml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    pids_limit: 256
    mem_limit: 2g
