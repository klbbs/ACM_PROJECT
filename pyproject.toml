[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oj-account-crawler"
version = "0.15.2"
description = "ACM Lab: algorithm training dashboard, collectors and AI coaching"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "tomli>=2,<3; python_version<'3.11'", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ojcrawl = "ojcrawler.cli:main"
acm-web = "acmweb.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acmweb = ["browser_extension/*.json", "browser_extension/*.js", "browser_extension/*.html", "browser_extension/*.css", "userscripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
